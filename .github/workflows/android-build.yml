name: Android CI & GitHub Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || format('Release v1.0.{0}', github.run_number) }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          body: |
            ## 📱 AlifiaRestuAnanda App Release

            ### 🚀 Changelog
            * **Build Number:** `#${{ github.run_number }}`
            * **Commit:** `${{ github.sha }}`
            * **Branch/Tag:** `${{ github.ref_name }}`

            #### 🔍 Ringkasan Perubahan:
            * Implementasi **Login Layout** & **Splash Screen**
            * Penyesuaian **Style** `button_OK_Biru`
            * Konfigurasi **AndroidManifest.xml** Launcher Activity
            * Otomatis terkompilasi via **GitHub Actions Runner**

            ---
            *APK siap diunduh pada lampiran di bawah ini.* 📦
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
